<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock - Vinoteca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="encabezado">
      <h1>Stock</h1>
      <button id="btn-salir" class="btn-salir">Salir</button>
    </header>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Producto</th>
          <th>Stock</th>
          <th>Mínimo</th>
        </tr>
      </thead>
      <tbody id="tabla-stock"></tbody>
    </table>

    <h2>Registrar venta</h2>
    <form id="form-venta">
      <select id="producto" required></select>
      <input type="number" id="cantidad" min="1" value="1" required>
      <button type="submit">Vender</button>
    </form>
    <p id="mensaje"></p>
    <h2>Cargar mercadería</h2>
    <form id="form-entrada">
      <select id="producto-entrada" required></select>
      <input type="number" id="cantidad-entrada" min="1" value="1" required>
      <button type="submit" class="btn-entrada">Cargar</button>
    </form>
    <p id="mensaje-entrada"></p>
    <h2>Nuevo producto</h2>
    <form id="form-producto" class="form-producto">
      <input type="text" id="nuevo-nombre" placeholder="Nombre (ej: Rosado 750ml)" required>
      <input type="text" id="nuevo-categoria" placeholder="Categoría (ej: Rosados)">
      <input type="number" id="nuevo-precio" placeholder="Precio" min="1" step="0.01" required>
      <input type="number" id="nuevo-minimo" placeholder="Mínimo" min="0" value="0" required>
      <button type="submit">Crear</button>
    </form>
    <p id="mensaje-producto"></p>
    <h2>Últimos movimientos</h2>
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Producto</th>
          <th>Tipo</th>
          <th>Cantidad</th>
        </tr>
      </thead>
      <tbody id="tabla-movimientos"></tbody>
    </table>
  </main>
  <script src="app.js"></script>
</body>
</html>
