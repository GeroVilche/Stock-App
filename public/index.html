<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock - Vinoteca</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Stock</h1>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Producto</th>
          <th>Stock</th>
        </tr>
      </thead>
      <tbody id="tabla-stock"></tbody>
    </table>

    <h2>Registrar venta</h2>
    <form id="form-venta">
      <select id="producto" required></select>
      <input type="number" id="cantidad" min="1" value="1" required>
      <button type="submit">Vender</button>
    </form>
    <p id="mensaje"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
